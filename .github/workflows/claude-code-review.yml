name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pr-data
          gh pr diff ${{ github.event.pull_request.number }} > /tmp/pr-data/diff.txt
          gh pr view ${{ github.event.pull_request.number }} --json title,body,baseRefName,headRefName > /tmp/pr-data/info.json

      - name: Run Claude Code Review
        id: review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_MODEL: deepseek-v4-pro[1M]
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4-pro[1M]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
        with:
          anthropic_api_key: ${{ secrets.DEEPSEEK_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review the pull request using the data already fetched:

            PR info: /tmp/pr-data/info.json
            PR diff: /tmp/pr-data/diff.txt

            Steps:
            1. Read /tmp/pr-data/info.json to understand what this PR is about
            2. Read /tmp/pr-data/diff.txt to see all code changes
            3. Read CLAUDE.md if it exists for project-specific rules
            4. Analyze the diff for:
               - Bugs that would break functionality
               - Logic errors and edge cases
               - Security vulnerabilities
               - CLAUDE.md violations (if CLAUDE.md exists)
            5. Skip: formatting, style, type errors, pre-existing issues
            6. Write your review to /tmp/pr-data/review.md

            Review format in /tmp/pr-data/review.md:
            ### Code Review
            [Findings with file paths and line numbers, or "No issues found."]
            🤖 Generated with [Claude Code](https://claude.ai/code)
          claude_args: "--model deepseek-v4-pro[1M] --max-turns 15 --allowedTools Bash,Read,Write,Grep,Glob"

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/pr-data/review.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/pr-data/review.md
          else
            gh pr comment ${{ github.event.pull_request.number }} --body "### Code Review

          ⚠️ Review did not produce output. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          fi
