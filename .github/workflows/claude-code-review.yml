name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_MODEL: deepseek-v4-pro[1M]
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4-pro[1M]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
        with:
          anthropic_api_key: ${{ secrets.DEEPSEEK_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in this repository.

            Steps:
            1. Run `gh pr view ${{ github.event.pull_request.number }}` to see PR details
            2. Run `gh pr diff ${{ github.event.pull_request.number }}` to see code changes
            3. Analyze the diff for bugs, logic errors, security vulnerabilities, and CLAUDE.md violations
            4. Post your findings as a PR comment using `gh pr comment ${{ github.event.pull_request.number }} --body "..."`

            Rules:
            - Only report real bugs that would break functionality. Skip formatting, style, and issues linters/typecheckers catch.
            - If no issues found, post: "No issues found."
            - Sign off with: 🤖 Generated with [Claude Code](https://claude.ai/code)
          claude_args: "--model deepseek-v4-pro[1M] --max-turns 20"
