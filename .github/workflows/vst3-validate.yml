name: VST3 Validate

on:
  pull_request:
    paths:
      - 'vst-plugin/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone JUCE (shallow)
        run: |
          git clone --depth 1 --branch 8.0.8 https://github.com/juce-framework/JUCE.git "${{ github.workspace }}/JUCE"

      - name: Setup vcpkg
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV

      - name: Install dependencies (static)
        run: |
          vcpkg install --triplet x64-windows-static ixwebsocket

      - name: Configure CMake
        run: |
          if (Test-Path vst-plugin/build) { Remove-Item -Recurse -Force vst-plugin/build }
          cmake -S vst-plugin -B vst-plugin/build `
            -DCMAKE_BUILD_TYPE=Release `
            -DJUCE_PATH="${{ github.workspace }}/JUCE" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build VST3
        run: cmake --build vst-plugin/build --config Release

      - name: Download pluginval
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: Validate VST3
        run: |
          $vst3Path = Get-ChildItem -Path vst-plugin/build -Recurse -Filter "*.vst3" -Directory | Select-Object -First 1
          if (-not $vst3Path) {
            Write-Error "No VST3 bundle found under vst-plugin/build — build may have failed or target name changed."
            exit 1
          }
          Write-Host "Validating: $vst3Path"
          ./pluginval/pluginval.exe --strictness-level 5 "$vst3Path"
