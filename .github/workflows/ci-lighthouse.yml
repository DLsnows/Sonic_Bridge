name: CI / lighthouse

on:
  pull_request:
    branches: [dev, staging]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: "0238590a-890e-4117-9dcc-b001c484a6df"

jobs:
  lighthouse:
    name: Lighthouse Audit
    if: ${{ ! github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wait for Vercel preview
        id: vercel
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          environment: Preview

      - name: Install Playwright (chromium)
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Login & capture session cookie
        id: login
        env:
          BASE_URL: ${{ steps.vercel.outputs.url }}
          LIGHTHOUSE_EMAIL: ${{ secrets.LIGHTHOUSE_EMAIL }}
          LIGHTHOUSE_PASSWORD: ${{ secrets.LIGHTHOUSE_PASSWORD }}
        run: |
          set -e
          COOKIE="$(node scripts/lighthouse-vercel-login.mjs)"
          if [ -z "$COOKIE" ]; then
            echo "Login produced no cookie" >&2
            exit 1
          fi
          echo "::add-mask::$COOKIE"
          {
            echo "cookie<<__EOF__"
            echo "$COOKIE"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Lighthouse config with auth cookie
        env:
          LH_COOKIE: ${{ steps.login.outputs.cookie }}
        run: |
          mkdir -p .github
          node -e "
            const fs = require('fs');
            const cfg = {
              ci: {
                collect: {
                  numberOfRuns: 1,
                  settings: {
                    preset: 'desktop',
                    skipAudits: ['full-page-screenshot', 'screenshot-thumbnails', 'is-crawlable'],
                    extraHeaders: { Cookie: process.env.LH_COOKIE }
                  }
                }
              }
            };
            fs.writeFileSync('.github/lighthouserc.json', JSON.stringify(cfg, null, 2));
          "

      - name: Audit - Projects (home)
        id: lh-home
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.vercel.outputs.url }}/
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-home
          temporaryPublicStorage: true
          budgetPath: .github/lighthouse-budget.json
          configPath: .github/lighthouserc.json

      - name: Audit - Settings
        id: lh-settings
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.vercel.outputs.url }}/settings
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-settings
          temporaryPublicStorage: true
          budgetPath: .github/lighthouse-budget.json
          configPath: .github/lighthouserc.json

      - name: Audit - Project Overview
        id: lh-project
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.vercel.outputs.url }}/projects/${{ env.PROJECT_ID }}
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-project
          temporaryPublicStorage: true
          budgetPath: .github/lighthouse-budget.json
          configPath: .github/lighthouserc.json

      - name: Audit - Project Space
        id: lh-space
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.vercel.outputs.url }}/projects/${{ env.PROJECT_ID }}/space
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-space
          temporaryPublicStorage: true
          budgetPath: .github/lighthouse-budget.json
          configPath: .github/lighthouserc.json

      - name: Audit - Project Files
        id: lh-files
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.vercel.outputs.url }}/projects/${{ env.PROJECT_ID }}/files
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-files
          temporaryPublicStorage: true
          budgetPath: .github/lighthouse-budget.json
          configPath: .github/lighthouserc.json

      - name: Audit - Project Schedule
        id: lh-schedule
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.vercel.outputs.url }}/projects/${{ env.PROJECT_ID }}/schedule
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-schedule
          temporaryPublicStorage: true
          budgetPath: .github/lighthouse-budget.json
          configPath: .github/lighthouserc.json

      - name: Audit - Project Discussion
        id: lh-discussion
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.vercel.outputs.url }}/projects/${{ env.PROJECT_ID }}/discussion
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-discussion
          temporaryPublicStorage: true
          budgetPath: .github/lighthouse-budget.json
          configPath: .github/lighthouserc.json

      - name: Audit - Project Settings
        id: lh-project-settings
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.vercel.outputs.url }}/projects/${{ env.PROJECT_ID }}/settings
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-project-settings
          temporaryPublicStorage: true
          budgetPath: .github/lighthouse-budget.json
          configPath: .github/lighthouserc.json

      - name: Post results as PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.vercel.outputs.url }}
          MANIFEST_HOME: ${{ steps.lh-home.outputs.manifest }}
          MANIFEST_SETTINGS: ${{ steps.lh-settings.outputs.manifest }}
          MANIFEST_PROJECT: ${{ steps.lh-project.outputs.manifest }}
          MANIFEST_SPACE: ${{ steps.lh-space.outputs.manifest }}
          MANIFEST_FILES: ${{ steps.lh-files.outputs.manifest }}
          MANIFEST_SCHEDULE: ${{ steps.lh-schedule.outputs.manifest }}
          MANIFEST_DISCUSSION: ${{ steps.lh-discussion.outputs.manifest }}
          MANIFEST_PROJECT_SETTINGS: ${{ steps.lh-project-settings.outputs.manifest }}
        with:
          script: |
            function parseResults(stepOutput) {
              try {
                const manifest = JSON.parse(stepOutput);
                if (manifest && manifest.length > 0) {
                  const entry = manifest.find((m) => m.isRepresentativeRun) || manifest[0];
                  const summary = entry.summary || {};
                  return {
                    performance: Math.round((summary.performance || 0) * 100),
                    accessibility: Math.round((summary.accessibility || 0) * 100),
                    bestPractices: Math.round((summary['best-practices'] || 0) * 100),
                    seo: Math.round((summary.seo || 0) * 100),
                    url: entry.url || '',
                  };
                }
              } catch (e) {
                console.log('Failed to parse results:', e.message);
              }
              return null;
            }

            const pages = [
              { name: 'Projects (home)',      result: parseResults(process.env.MANIFEST_HOME) },
              { name: 'Settings',             result: parseResults(process.env.MANIFEST_SETTINGS) },
              { name: 'Project Overview',     result: parseResults(process.env.MANIFEST_PROJECT) },
              { name: 'Project / Space',      result: parseResults(process.env.MANIFEST_SPACE) },
              { name: 'Project / Files',      result: parseResults(process.env.MANIFEST_FILES) },
              { name: 'Project / Schedule',   result: parseResults(process.env.MANIFEST_SCHEDULE) },
              { name: 'Project / Discussion', result: parseResults(process.env.MANIFEST_DISCUSSION) },
              { name: 'Project / Settings',   result: parseResults(process.env.MANIFEST_PROJECT_SETTINGS) },
            ];

            function emoji(score) {
              if (score >= 90) return '🟢';
              if (score >= 50) return '🟠';
              return '🔴';
            }

            let body = '## ⚡ Lighthouse CI Results\n\n';
            body += `Audited against preview: ${process.env.PREVIEW_URL}\n\n`;
            body += '| Page | Performance | Accessibility | Best Practices | SEO |\n';
            body += '|------|------------|---------------|----------------|-----|\n';

            for (const page of pages) {
              if (page.result) {
                const r = page.result;
                body += `| ${page.name} | ${emoji(r.performance)} ${r.performance} | ${emoji(r.accessibility)} ${r.accessibility} | ${emoji(r.bestPractices)} ${r.bestPractices} | ${emoji(r.seo)} ${r.seo} |\n`;
              } else {
                body += `| ${page.name} | ⚠️ No data | - | - | - |\n`;
              }
            }

            body += '\n> Single run per page. Authenticated as the Lighthouse test account.';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const marker = '## ⚡ Lighthouse CI Results';
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
