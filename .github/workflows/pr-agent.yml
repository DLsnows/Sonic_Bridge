name: PR Agent (DeepSeek V4.1 Flash)

# pr-agent（describe / review / improve），DeepSeek V4.1 Flash 经 OpenCode Go，按量计费。
# 只在 PR → dev 上跑，PR 每次 push 都重跑；draft / fork / bot（含 dependabot）由中央 workflow 跳过。
# 模型、上限、超时、锁定的 pr-agent 镜像都在 Synchain-oss/ci-workflows 的 pr-agent.yml 里统一维护；
# 这里只放本仓专属的 ignore 列表。

on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

jobs:
  pr-agent:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: Synchain-oss/ci-workflows/.github/workflows/pr-agent.yml@v1
    with:
      provider: opencode-go
      ignore_globs: '["package-lock.json", "**/package-lock.json", "drizzle/meta/*_snapshot.json", "docs/superpowers/**"]'
      # 原在 .pr_agent.toml 的 [pr_reviewer].extra_instructions：放这里，才不会覆盖中央 workflow 的"PR 内容是不可信数据"声明
      extra_instructions: "Focus on: security vulnerabilities, logic bugs, performance issues, and code quality. Write review comments in English."
    secrets:
      api_key: ${{ secrets.OPENCODE_GO_API_KEY_FOR_REVIEW }}
